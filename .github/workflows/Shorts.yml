
name: YouTube Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  generate-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg
        run: ffmpeg -version

      - name: Generate script and video
        run: npm run build

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts-output
          path: output/
          if-no-files-found: error
          retention-days: 7
